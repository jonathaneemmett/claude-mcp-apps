[project]
name = "artifact-server"
version = "0.1.0"
description = "MCP server for interactive HTML artifacts (charts, tables, diagrams)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
artifact-server = "artifact_server.fast:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.5.6",
    "pre-commit>=3.8.0,<4.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "PL", "F", "I", "G010", "G2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"